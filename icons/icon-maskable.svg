<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background diagonal gradient -->
    <linearGradient id="bgGradientMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0633C" />
      <stop offset="50%" stop-color="#AA5498" />
      <stop offset="100%" stop-color="#724DE4" />
    </linearGradient>

    <!-- Clean vector drop shadow with wide bounds to prevent any rectangular seams -->
    <filter id="dropShadowMaskable" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.22" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background (square for adaptive OS masking) -->
  <rect width="512" height="512" fill="url(#bgGradientMaskable)" />

  <!-- Icon Elements scaled to fit comfortably inside the 80% safe zone -->
  <g transform="translate(256 256) scale(0.82) translate(-256 -256)" filter="url(#dropShadowMaskable)" fill="#FFFFFF">
    <!-- Top Bar -->
    <rect x="120" y="160" width="272" height="32" rx="16" />

    <!-- Middle Bar -->
    <rect x="120" y="240" width="182" height="32" rx="16" />

    <!-- Dot / Circle -->
    <circle cx="352" cy="256" r="28" />

    <!-- Bottom Bar -->
    <rect x="120" y="320" width="232" height="32" rx="16" />
  </g>
</svg>